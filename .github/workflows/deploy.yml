name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test FitnessTracker.slnx --configuration Release

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      - name: Build and push image
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/tracker:${{ github.sha }}
          docker build -t $IMAGE -t ${{ secrets.ACR_LOGIN_SERVER }}/tracker:latest .
          docker push $IMAGE
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/tracker:latest

      - name: Deploy to Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: tracker-prod
          resourceGroup: RG_Tracker
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/tracker:${{ github.sha }}

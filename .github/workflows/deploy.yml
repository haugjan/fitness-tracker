name: Deploy

# Auf main wird nie direkt gepusht, der Branch ist geschützt. Hierher kommt Code
# ausschliesslich über einen zusammengeführten Pull Request, und genau das löst den
# Produktionsdeploy aus.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test FitnessTracker.slnx --configuration Release

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      - name: Build and push image
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/tracker:${{ github.sha }}
          docker build -t $IMAGE -t ${{ secrets.ACR_LOGIN_SERVER }}/tracker:latest .
          docker push $IMAGE
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/tracker:latest

      - name: Deploy to Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: tracker-prod
          resourceGroup: RG_Tracker
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/tracker:${{ github.sha }}

      - name: Smoke test
        run: |
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://tracker.haugrein.ch/healthz || true)
            if [ "$code" = "200" ]; then echo "healthz ok"; exit 0; fi
            sleep 10
          done
          echo "healthz hat nicht geantwortet"
          exit 1

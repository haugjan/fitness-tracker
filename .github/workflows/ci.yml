name: CI

on:
  push:
    branches-ignore: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FitnessTracker.slnx

      - name: Build
        run: dotnet build FitnessTracker.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test FitnessTracker.slnx --no-build --configuration Release --verbosity normal
